{% extends "appbuilder/base.html" %}
{% block content %}
<div class="container-fluid" style="padding-top: 20px;">
  <h2>{{ titulo }}</h2>
  <table class="table table-striped table-bordered" style="margin-top:20px;">
    <thead style="background-color:#2c3e50; color:white;">
      <tr>
        {% for col in columnas %}
        <th>{{ col }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for fila in filas %}
      <tr>
        {% for valor in fila %}
        <td>{{ valor }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
